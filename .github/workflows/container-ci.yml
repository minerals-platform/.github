name: Reusable container CI

on:
  workflow_call:
    inputs:
      image-name:
        description: Image path below the registry hostname
        required: true
        type: string
      context:
        description: Docker build context
        default: .
        type: string
      dockerfile:
        description: Dockerfile path
        default: Dockerfile
        type: string
      build-args:
        description: Optional newline-separated Docker build arguments
        default: ''
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false
      COOLIFY_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          push: false
          tags: local/${{ inputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-and-deploy:
    name: Publish SHA image and deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, linux, x64, minerals-production]
    environment: production
    concurrency:
      group: production-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate publication configuration
        env:
          REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          test -n "$REGISTRY"
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_PASSWORD"
      - name: Sign in to the private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          push: true
          tags: ${{ vars.CONTAINER_REGISTRY }}/${{ inputs.image-name }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/buildx-cache/${{ github.event.repository.name }}
          cache-to: type=local,dest=/tmp/buildx-cache-new/${{ github.event.repository.name }},mode=max
      - name: Rotate local build cache
        run: |
          rm -rf "/tmp/buildx-cache/${{ github.event.repository.name }}"
          mv "/tmp/buildx-cache-new/${{ github.event.repository.name }}" "/tmp/buildx-cache/${{ github.event.repository.name }}"
      - name: Select immutable image in Coolify and deploy
        if: env.COOLIFY_URL != '' && env.COOLIFY_APPLICATION_UUID != '' && env.COOLIFY_TOKEN != ''
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          payload="$(printf '{"docker_registry_image_name":"%s/%s","docker_registry_image_tag":"%s"}' "$REGISTRY" "$IMAGE_NAME" "$IMAGE_TAG")"
          curl --fail --silent --show-error --retry 3 \
            --request PATCH "$COOLIFY_URL/api/v1/applications/$COOLIFY_APPLICATION_UUID" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload"
          curl --fail --silent --show-error --retry 3 \
            --request POST "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APPLICATION_UUID&force=false" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
